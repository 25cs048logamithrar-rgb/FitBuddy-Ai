<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FitBuddy Feedback</h1>

    <form method="post" action="/feedback">

        <label>Your Feedback</label>

        <textarea
            name="feedback"
            placeholder="Enter your feedback..."
            required>
        </textarea>

        <button type="submit">
            Submit Feedback
        </button>

    </form>

</div>

</body>
</html>
